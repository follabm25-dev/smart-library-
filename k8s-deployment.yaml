apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-library
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smart-library
  template:
    metadata:
      labels:
        app: smart-library
    spec:
      containers:
      - name: smart-library
        image: folla25/smart-library:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: smart-library-service
spec:
  type: LoadBalancer
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: smart-library